name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/walter-sql/engine
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Version and channel from the tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$([[ $VERSION == *-* ]] && echo next || echo latest)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm set-version "$VERSION"
      - run: pnpm build
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Overwritable steps first: npm is the one publish that cannot be redone.
      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f packages/engine/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:$CHANNEL" .
      - name: Publish packages
        run: pnpm -r --filter './packages/*' publish --no-git-checks --tag "$CHANNEL"
      - name: GitHub release
        run: |
          PREV=$(git describe --tags --abbrev=0 --exclude '*-*' HEAD^ 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --notes "$(git log --pretty='- %s' ${PREV:+$PREV..}HEAD)" \
            $([[ $CHANNEL == next ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
