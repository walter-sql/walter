services:
  postgres:
    image: postgres:18
    command: -c wal_level=logical
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 2s
      timeout: 2s
      retries: 15

  walter:
    build:
      context: ../..
      dockerfile: packages/engine/Dockerfile
    environment:
      WALTER_PG: postgres://postgres:postgres@postgres:5432/demo
    ports:
      - "5544:5544"
    depends_on:
      postgres:
        condition: service_healthy
